[project]
name = "dsp2-client"
version = "0.1.0"
description = "SDK Python pour consommer l’API DSP2 bancaire"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Habib Boukrana", email = "mhabib.boukrana@gmail.com"}
]
dependencies = []


[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
